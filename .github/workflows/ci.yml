name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 语法检查
        run: python -m compileall -q app.py scripts pageindex

      - name: 导入自检
        run: python -c "from pageindex import PageIndexClient; print('PageIndexClient ok')"

      - name: 应用可启动(无模型配置也应正常渲染提示)
        env:
          LLM_KEY: ""
        run: |
          python -m streamlit run app.py --server.headless true --server.port 8599 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8599/_stcore/health >/dev/null; then
              echo "health ok"; exit 0
            fi
            sleep 1
          done
          echo "streamlit 未能启动"; exit 1
