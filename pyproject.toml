# 应用级元数据(不使用打包/安装流程, 依赖统一由 requirements.txt 管理)
[project]
name = "agentic_rag"
version = "0.1.0"
description = "Vectorless, chunk-free document QA: a tree index plus LLM navigation, packaged as a local Streamlit UI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["rag", "vectorless", "pageindex", "streamlit", "llm", "document-qa"]
classifiers = [
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
